<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MonoBlock">
<link rel="manifest" href="./manifest.json">
<title>MonoBlock</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif}
body{touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#fff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,DPR=1,lastTime=0,accumulator=0;
const FIXED_DT=1/120;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();
let audioCtx=null,musicTimer=null,musicRunning=false,musicStep=0;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(()=>{})}
function playTone(f,d,v,type="square",when=0){if(!audioCtx)return;const n=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.006);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d+.02)}
function jumpSound(){initAudio();if(!audioCtx)return;playTone(400,.12,.12,"square");}
function deathSound(){initAudio();if(!audioCtx)return;playTone(190,.4,.23,"sawtooth")}
const STATE={MENU:0,RUNNING:1,DEAD:2};let state=STATE.MENU;
const player={x:150,y:0,size:42,vx:430,vy:0,gravity:2350,jumpPower:850,grounded:false,rotation:0};
let cameraX=0,obstacles=[],bonusSquares=[],nextObstacleX=650,nextBonusX=900,distance=0,phaseSquares=0,totalSquares=0,highScore=0,particles=[];
try{highScore=Number(localStorage.getItem("monoblock_highscore")||0)}catch(e){}
function groundY(){return H*.78}
function resetPlayer(){player.x=150;player.y=groundY()-player.size;player.vx=430;player.vy=0;player.grounded=true;player.rotation=0;cameraX=0}
function createBlock(x,w=42,h=42){obstacles.push({type:"block",x,y:h,width:w,height:h})}
function createSpike(x,size=42){obstacles.push({type:"spike",x,y:size,width:size,height:size})}
function createDoubleSpike(x){createSpike(x);createSpike(x+38)}
function resetWorld(){obstacles=[];bonusSquares=[];nextObstacleX=650;nextBonusX=900;generateWorld()}
function generateWorld(){while(nextObstacleX<player.x+2500){nextObstacleX+=260+Math.random()*250;const t=Math.random();if(t<.5)createBlock(nextObstacleX);else if(t<.78)createSpike(nextObstacleX);else createDoubleSpike(nextObstacleX)}while(nextBonusX<player.x+2800){nextBonusX+=500+Math.random()*500;bonusSquares.push({x:nextBonusX,y:95+Math.random()*100,size:20,collected:false,pulse:Math.random()*Math.PI*2})}}
function startGame(){initAudio();resetPlayer();distance=0;phaseSquares=0;totalSquares=0;particles=[];resetWorld();state=STATE.RUNNING}
function restartGame(){startGame()}
function handleInput(){initAudio();if(state===STATE.MENU){startGame();return}if(state===STATE.DEAD){restartGame();return}if(state===STATE.RUNNING&&player.grounded){player.vy=-player.jumpPower;player.grounded=false;jumpSound()}}
addEventListener("pointerdown",handleInput);addEventListener("keydown",e=>{if(["Space","ArrowUp","KeyW"].includes(e.code)){e.preventDefault();handleInput()}})
function hitbox(){return{x:player.x+5,y:player.y+5,width:player.size-10,height:player.size-10}}
function aabb(a,b){return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y}
function die(){if(state!==STATE.RUNNING)return;state=STATE.DEAD;deathSound();if(distance>highScore){highScore=distance;try{localStorage.setItem("monoblock_highscore",highScore)}catch(e){}}}
function checkCollisions(){const p=hitbox(),gy=groundY();for(const o of obstacles){const b={x:o.x,y:gy-o.height,width:o.width,height:o.height};if(aabb(p,b)){die();return}}for(const b of bonusSquares){if(b.collected)continue;const q={x:b.x-b.size/2,y:b.y-b.size/2,width:b.size,height:b.size};if(aabb(p,q)){b.collected=true;phaseSquares++;totalSquares++}}}
function update(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}if(state!==STATE.RUNNING)return;player.x+=player.vx*dt;player.vy+=player.gravity*dt;player.y+=player.vy*dt;const floor=groundY()-player.size;if(player.y>=floor){player.y=floor;player.vy=0;player.grounded=true}else player.grounded=false;player.rotation+=player.grounded?0:7.5*dt;cameraX+=(player.x-W*.24-cameraX)*.12;if(cameraX<0)cameraX=0;distance=Math.max(0,Math.floor(player.x/10));const level=Math.floor(distance/500);player.vx=Math.min(430+level*18,760);generateWorld();checkCollisions()}
function sx(x){return x-cameraX}
function draw(){ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fafafa";for(let x=(-cameraX%80);x<W;x+=80)ctx.fillRect(x,0,1,H);const gy=groundY();ctx.fillStyle="#fff";ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle="#111";ctx.fillRect(0,gy,W,5);for(const o of obstacles){const x=sx(o.x);if(x<-100||x>W+100)continue;const y=gy-o.height;ctx.fillStyle="#111";if(o.type==="block"){ctx.fillRect(x,y,o.width,o.height);ctx.fillStyle="#fff";ctx.fillRect(x+7,y+7,o.width-14,o.height-14);ctx.fillStyle="#111";ctx.fillRect(x+15,y+15,o.width-30,o.height-30)}else{ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+o.width/2,y);ctx.lineTo(x+o.width,gy);ctx.closePath();ctx.fillStyle="#111";ctx.fill()}}for(const b of bonusSquares){if(b.collected)continue;const x=sx(b.x);if(x<-50||x>W+50)continue;const s=b.size+Math.sin(performance.now()*.005+b.pulse)*3;ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.strokeRect(x-s/2,b.y-s/2,s,s);ctx.fillStyle="#111";ctx.fillRect(x-4,b.y-4,8,8)}ctx.save();ctx.translate(sx(player.x)+21,player.y+21);ctx.rotate(player.rotation);ctx.fillStyle="#080808";ctx.beginPath();ctx.roundRect(-21,-21,42,42,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(-15,-15,30,30,4);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(-13,-11,9,12);ctx.fillRect(4,-11,9,12);ctx.fillRect(-11,7,22,7);ctx.restore();ctx.fillStyle="#111";ctx.font="900 18px Arial";ctx.textAlign="left";ctx.fillText("MONOBLOCK",20,30);ctx.font="bold 14px Arial";ctx.fillText("DIST "+distance,20,52);ctx.textAlign="right";ctx.fillText("BEST "+highScore,W-20,30);ctx.fillText("SQUARES "+totalSquares,W-20,52);if(state===STATE.MENU||state===STATE.DEAD){ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="#111";ctx.font=state===STATE.DEAD?"900 42px Arial":"900 48px Arial";ctx.fillText(state===STATE.DEAD?"BATIDA!":"MONOBLOCK",W/2,H/2-45);ctx.font="bold 17px Arial";ctx.fillText(state===STATE.DEAD?"TOQUE PARA TENTAR NOVAMENTE":"TOQUE PARA COMEÇAR",W/2,H/2+10);ctx.font="14px Arial";ctx.fillStyle="#555";ctx.fillText("Toque ou pressione Espaço para pular",W/2,H/2+42);ctx.textAlign="left"}}
function loop(time){if(!lastTime)lastTime=time;let dt=Math.min(.05,(time-lastTime)/1000);lastTime=time;accumulator+=dt;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT}draw();requestAnimationFrame(loop)}
resetPlayer();requestAnimationFrame(loop);
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
document.addEventListener("visibilitychange",()=>{if(document.hidden){lastTime=performance.now();accumulator=0}})
</script>
</body>
</html>
